<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1300" viewBox="0 0 1600 1300">
<rect width="100%" height="100%" fill="#F6F9FB"/>
<text x="800.0" y="42" text-anchor="middle" font-family="Arial" font-size="29" font-weight="bold" fill="#18324B">NexVitals V1 — Admin Workflow</text>
<rect x="150" y="75" width="1300" height="78" rx="15" fill="#E8F1F8" stroke="#2F6B8A" stroke-width="3"/>
<text x="800.0" y="105" text-anchor="middle" font-family="Arial" font-size="20" font-weight="bold" fill="#18324B">A01 Admin Login</text>
<text x="800.0" y="130" text-anchor="middle" font-family="Arial" font-size="15" fill="#435766">Authenticate; enforce Admin role at backend; failed login is rate-limited and audited.</text>
<line x1="800.0" y1="153" x2="800.0" y2="185" stroke="#607D8B" stroke-width="3"/>
<polygon points="792.0,175 808.0,175 800.0,188" fill="#607D8B"/>
<rect x="150" y="193" width="1300" height="78" rx="15" fill="#E8F1F8" stroke="#2F6B8A" stroke-width="3"/>
<text x="800.0" y="223" text-anchor="middle" font-family="Arial" font-size="20" font-weight="bold" fill="#18324B">A02 Admin Dashboard</text>
<text x="800.0" y="248" text-anchor="middle" font-family="Arial" font-size="15" fill="#435766">Show authorized aggregate counts, device alerts and recent checkups.</text>
<line x1="800.0" y1="271" x2="800.0" y2="303" stroke="#607D8B" stroke-width="3"/>
<polygon points="792.0,293 808.0,293 800.0,306" fill="#607D8B"/>
<rect x="150" y="311" width="1300" height="78" rx="15" fill="#E8F1F8" stroke="#2F6B8A" stroke-width="3"/>
<text x="800.0" y="341" text-anchor="middle" font-family="Arial" font-size="20" font-weight="bold" fill="#18324B">A03 Patient Management</text>
<text x="800.0" y="366" text-anchor="middle" font-family="Arial" font-size="15" fill="#435766">Search and manage authorized patient records; log record access.</text>
<line x1="800.0" y1="389" x2="800.0" y2="421" stroke="#607D8B" stroke-width="3"/>
<polygon points="792.0,411 808.0,411 800.0,424" fill="#607D8B"/>
<rect x="150" y="429" width="1300" height="78" rx="15" fill="#E8F1F8" stroke="#2F6B8A" stroke-width="3"/>
<text x="800.0" y="459" text-anchor="middle" font-family="Arial" font-size="20" font-weight="bold" fill="#18324B">A04 Staff Management</text>
<text x="800.0" y="484" text-anchor="middle" font-family="Arial" font-size="15" fill="#435766">Create/update/disable staff accounts; apply least privilege; Admin only.</text>
<line x1="800.0" y1="507" x2="800.0" y2="539" stroke="#607D8B" stroke-width="3"/>
<polygon points="792.0,529 808.0,529 800.0,542" fill="#607D8B"/>
<rect x="150" y="547" width="1300" height="78" rx="15" fill="#E8F1F8" stroke="#2F6B8A" stroke-width="3"/>
<text x="800.0" y="577" text-anchor="middle" font-family="Arial" font-size="20" font-weight="bold" fill="#18324B">A05 Test Catalog</text>
<text x="800.0" y="602" text-anchor="middle" font-family="Arial" font-size="15" fill="#435766">Manage test name/code, unit, instructions, eligibility and enabled status; version changes.</text>
<line x1="800.0" y1="625" x2="800.0" y2="657" stroke="#607D8B" stroke-width="3"/>
<polygon points="792.0,647 808.0,647 800.0,660" fill="#607D8B"/>
<rect x="150" y="665" width="1300" height="78" rx="15" fill="#E8F1F8" stroke="#2F6B8A" stroke-width="3"/>
<text x="800.0" y="695" text-anchor="middle" font-family="Arial" font-size="20" font-weight="bold" fill="#18324B">A06 Device Inventory</text>
<text x="800.0" y="720" text-anchor="middle" font-family="Arial" font-size="15" fill="#435766">Manage OEM, model, serial, connectivity, status and maintenance/calibration details.</text>
<line x1="800.0" y1="743" x2="800.0" y2="775" stroke="#607D8B" stroke-width="3"/>
<polygon points="792.0,765 808.0,765 800.0,778" fill="#607D8B"/>
<rect x="150" y="783" width="1300" height="78" rx="15" fill="#E8F1F8" stroke="#2F6B8A" stroke-width="3"/>
<text x="800.0" y="813" text-anchor="middle" font-family="Arial" font-size="20" font-weight="bold" fill="#18324B">A07 Checkup Management</text>
<text x="800.0" y="838" text-anchor="middle" font-family="Arial" font-size="15" fill="#435766">View Checkup ID, patient, assigned staff, state and date; review paused/cancelled/incomplete cases.</text>
<line x1="800.0" y1="861" x2="800.0" y2="893" stroke="#607D8B" stroke-width="3"/>
<polygon points="792.0,883 808.0,883 800.0,896" fill="#607D8B"/>
<rect x="150" y="901" width="1300" height="78" rx="15" fill="#E8F1F8" stroke="#2F6B8A" stroke-width="3"/>
<text x="800.0" y="931" text-anchor="middle" font-family="Arial" font-size="20" font-weight="bold" fill="#18324B">A08 Report Management</text>
<text x="800.0" y="956" text-anchor="middle" font-family="Arial" font-size="15" fill="#435766">Search reports, review status and download permissions; issued reports immutable or corrected by version.</text>
<line x1="800.0" y1="979" x2="800.0" y2="1011" stroke="#607D8B" stroke-width="3"/>
<polygon points="792.0,1001 808.0,1001 800.0,1014" fill="#607D8B"/>
<rect x="150" y="1019" width="1300" height="78" rx="15" fill="#E7F3F1" stroke="#238C8C" stroke-width="3"/>
<text x="800.0" y="1049" text-anchor="middle" font-family="Arial" font-size="20" font-weight="bold" fill="#18324B">A09 Settings & Audit</text>
<text x="800.0" y="1074" text-anchor="middle" font-family="Arial" font-size="15" fill="#435766">Controlled settings, language, sync status and user-action logs; Admin-only changes.</text>
<line x1="800.0" y1="1097" x2="800.0" y2="1129" stroke="#607D8B" stroke-width="3"/>
<polygon points="792.0,1119 808.0,1119 800.0,1132" fill="#607D8B"/>
<rect x="150" y="1137" width="1300" height="78" rx="15" fill="#FFF2DF" stroke="#C58A35" stroke-width="3"/>
<text x="800.0" y="1167" text-anchor="middle" font-family="Arial" font-size="20" font-weight="bold" fill="#18324B">Cross-cutting control</text>
<text x="800.0" y="1192" text-anchor="middle" font-family="Arial" font-size="15" fill="#435766">Every protected action is checked by backend APIs and logged where required; technical support has no default identifiable-record access.</text>
</svg>
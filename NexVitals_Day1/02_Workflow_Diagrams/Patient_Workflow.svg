<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1890" viewBox="0 0 1600 1890">
<rect width="100%" height="100%" fill="#F6F9FB"/>
<text x="800.0" y="42" text-anchor="middle" font-family="Arial" font-size="29" font-weight="bold" fill="#18324B">NexVitals V1 — Patient Workflow</text>
<rect x="150" y="75" width="1300" height="78" rx="15" fill="#E8F1F8" stroke="#2F6B8A" stroke-width="3"/>
<text x="800.0" y="105" text-anchor="middle" font-family="Arial" font-size="20" font-weight="bold" fill="#18324B">Start → P01 Welcome</text>
<text x="800.0" y="130" text-anchor="middle" font-family="Arial" font-size="15" fill="#435766">Display product introduction; Get Started.</text>
<line x1="800.0" y1="153" x2="800.0" y2="185" stroke="#607D8B" stroke-width="3"/>
<polygon points="792.0,175 808.0,175 800.0,188" fill="#607D8B"/>
<rect x="150" y="193" width="1300" height="78" rx="15" fill="#E8F1F8" stroke="#2F6B8A" stroke-width="3"/>
<text x="800.0" y="223" text-anchor="middle" font-family="Arial" font-size="20" font-weight="bold" fill="#18324B">P02 Language → P03 Entry Choice</text>
<text x="800.0" y="248" text-anchor="middle" font-family="Arial" font-size="15" fill="#435766">English / Hindi / Marathi; Register or Login.</text>
<line x1="800.0" y1="271" x2="800.0" y2="303" stroke="#607D8B" stroke-width="3"/>
<polygon points="792.0,293 808.0,293 800.0,306" fill="#607D8B"/>
<rect x="150" y="311" width="1300" height="78" rx="15" fill="#E8F1F8" stroke="#2F6B8A" stroke-width="3"/>
<text x="800.0" y="341" text-anchor="middle" font-family="Arial" font-size="20" font-weight="bold" fill="#18324B">P04 Registration / P05 Login</text>
<text x="800.0" y="366" text-anchor="middle" font-family="Arial" font-size="15" fill="#435766">Validate required inputs; create/authenticate account.</text>
<line x1="800.0" y1="389" x2="800.0" y2="421" stroke="#607D8B" stroke-width="3"/>
<polygon points="792.0,411 808.0,411 800.0,424" fill="#607D8B"/>
<rect x="150" y="429" width="1300" height="78" rx="15" fill="#FFF2DF" stroke="#C58A35" stroke-width="3"/>
<text x="800.0" y="459" text-anchor="middle" font-family="Arial" font-size="20" font-weight="bold" fill="#18324B">Decision: registration or login valid?</text>
<text x="800.0" y="484" text-anchor="middle" font-family="Arial" font-size="15" fill="#435766">No: show field-level or safe generic error; retry/recover. Yes: P06 dashboard.</text>
<line x1="800.0" y1="507" x2="800.0" y2="539" stroke="#607D8B" stroke-width="3"/>
<polygon points="792.0,529 808.0,529 800.0,542" fill="#607D8B"/>
<rect x="150" y="547" width="1300" height="78" rx="15" fill="#E8F1F8" stroke="#2F6B8A" stroke-width="3"/>
<text x="800.0" y="577" text-anchor="middle" font-family="Arial" font-size="20" font-weight="bold" fill="#18324B">P06 Patient Dashboard → P07 Test Selection</text>
<text x="800.0" y="602" text-anchor="middle" font-family="Arial" font-size="15" fill="#435766">Start new checkup; select BP, SpO₂, temperature, weight and/or height.</text>
<line x1="800.0" y1="625" x2="800.0" y2="657" stroke="#607D8B" stroke-width="3"/>
<polygon points="792.0,647 808.0,647 800.0,660" fill="#607D8B"/>
<rect x="150" y="665" width="1300" height="78" rx="15" fill="#FFF2DF" stroke="#C58A35" stroke-width="3"/>
<text x="800.0" y="695" text-anchor="middle" font-family="Arial" font-size="20" font-weight="bold" fill="#18324B">Device/test eligibility check</text>
<text x="800.0" y="720" text-anchor="middle" font-family="Arial" font-size="15" fill="#435766">Unavailable: show affected test and reason; allow edit/cancel; do not fabricate data.</text>
<line x1="800.0" y1="743" x2="800.0" y2="775" stroke="#607D8B" stroke-width="3"/>
<polygon points="792.0,765 808.0,765 800.0,778" fill="#607D8B"/>
<rect x="150" y="783" width="1300" height="78" rx="15" fill="#E8F1F8" stroke="#2F6B8A" stroke-width="3"/>
<text x="800.0" y="813" text-anchor="middle" font-family="Arial" font-size="20" font-weight="bold" fill="#18324B">P08 Checkup Confirmation → Create Checkup ID</text>
<text x="800.0" y="838" text-anchor="middle" font-family="Arial" font-size="15" fill="#435766">Confirm selected tests; staff verifies patient identity and checkup link.</text>
<line x1="800.0" y1="861" x2="800.0" y2="893" stroke="#607D8B" stroke-width="3"/>
<polygon points="792.0,883 808.0,883 800.0,896" fill="#607D8B"/>
<rect x="150" y="901" width="1300" height="78" rx="15" fill="#E8F1F8" stroke="#2F6B8A" stroke-width="3"/>
<text x="800.0" y="931" text-anchor="middle" font-family="Arial" font-size="20" font-weight="bold" fill="#18324B">P09 Instructions → P10 Measurement Capture</text>
<text x="800.0" y="956" text-anchor="middle" font-family="Arial" font-size="15" fill="#435766">Staff assists; capture OEM reading or verified staff manual entry.</text>
<line x1="800.0" y1="979" x2="800.0" y2="1011" stroke="#607D8B" stroke-width="3"/>
<polygon points="792.0,1001 808.0,1001 800.0,1014" fill="#607D8B"/>
<rect x="150" y="1019" width="1300" height="78" rx="15" fill="#FFF2DF" stroke="#C58A35" stroke-width="3"/>
<text x="800.0" y="1049" text-anchor="middle" font-family="Arial" font-size="20" font-weight="bold" fill="#18324B">Decision: reading valid and not duplicate?</text>
<text x="800.0" y="1074" text-anchor="middle" font-family="Arial" font-size="15" fill="#435766">No: reject/flag; allow authorized retake or mark failed/incomplete; preserve audit history.</text>
<line x1="800.0" y1="1097" x2="800.0" y2="1129" stroke="#607D8B" stroke-width="3"/>
<polygon points="792.0,1119 808.0,1119 800.0,1132" fill="#607D8B"/>
<rect x="150" y="1137" width="1300" height="78" rx="15" fill="#E8F1F8" stroke="#2F6B8A" stroke-width="3"/>
<text x="800.0" y="1167" text-anchor="middle" font-family="Arial" font-size="20" font-weight="bold" fill="#18324B">Save measurement with provenance</text>
<text x="800.0" y="1192" text-anchor="middle" font-family="Arial" font-size="15" fill="#435766">Record value(s), unit, timestamp, source, device ID and staff/verifier ID.</text>
<line x1="800.0" y1="1215" x2="800.0" y2="1247" stroke="#607D8B" stroke-width="3"/>
<polygon points="792.0,1237 808.0,1237 800.0,1250" fill="#607D8B"/>
<rect x="150" y="1255" width="1300" height="78" rx="15" fill="#E8F1F8" stroke="#2F6B8A" stroke-width="3"/>
<text x="800.0" y="1285" text-anchor="middle" font-family="Arial" font-size="20" font-weight="bold" fill="#18324B">Repeat selected tests → P11 Progress</text>
<text x="800.0" y="1310" text-anchor="middle" font-family="Arial" font-size="15" fill="#435766">Keep completed, pending, failed and skipped states distinct.</text>
<line x1="800.0" y1="1333" x2="800.0" y2="1365" stroke="#607D8B" stroke-width="3"/>
<polygon points="792.0,1355 808.0,1355 800.0,1368" fill="#607D8B"/>
<rect x="150" y="1373" width="1300" height="78" rx="15" fill="#FFF2DF" stroke="#C58A35" stroke-width="3"/>
<text x="800.0" y="1403" text-anchor="middle" font-family="Arial" font-size="20" font-weight="bold" fill="#18324B">Decision: all selected tests complete?</text>
<text x="800.0" y="1428" text-anchor="middle" font-family="Arial" font-size="15" fill="#435766">No: pause/resume or close as incomplete; never label completed.</text>
<line x1="800.0" y1="1451" x2="800.0" y2="1483" stroke="#607D8B" stroke-width="3"/>
<polygon points="792.0,1473 808.0,1473 800.0,1486" fill="#607D8B"/>
<rect x="150" y="1491" width="1300" height="78" rx="15" fill="#E7F3F1" stroke="#238C8C" stroke-width="3"/>
<text x="800.0" y="1521" text-anchor="middle" font-family="Arial" font-size="20" font-weight="bold" fill="#18324B">P12 Staff Review → P13 Screening Report</text>
<text x="800.0" y="1546" text-anchor="middle" font-family="Arial" font-size="15" fill="#435766">Review measurements; corrections audited; generate screening PDF with disclaimer.</text>
<line x1="800.0" y1="1569" x2="800.0" y2="1601" stroke="#607D8B" stroke-width="3"/>
<polygon points="792.0,1591 808.0,1591 800.0,1604" fill="#607D8B"/>
<rect x="150" y="1609" width="1300" height="78" rx="15" fill="#E7F3F1" stroke="#238C8C" stroke-width="3"/>
<text x="800.0" y="1639" text-anchor="middle" font-family="Arial" font-size="20" font-weight="bold" fill="#18324B">Local save → synchronization decision</text>
<text x="800.0" y="1664" text-anchor="middle" font-family="Arial" font-size="15" fill="#435766">Online: sync and show synced only after confirmation. Offline: queue and show pending.</text>
<line x1="800.0" y1="1687" x2="800.0" y2="1719" stroke="#607D8B" stroke-width="3"/>
<polygon points="792.0,1709 808.0,1709 800.0,1722" fill="#607D8B"/>
<rect x="150" y="1727" width="1300" height="78" rx="15" fill="#E7F3F1" stroke="#238C8C" stroke-width="3"/>
<text x="800.0" y="1757" text-anchor="middle" font-family="Arial" font-size="20" font-weight="bold" fill="#18324B">P14 Reports/History → P06 Dashboard</text>
<text x="800.0" y="1782" text-anchor="middle" font-family="Arial" font-size="15" fill="#435766">Patient accesses only own authorized reports; return to dashboard or logout.</text>
</svg>
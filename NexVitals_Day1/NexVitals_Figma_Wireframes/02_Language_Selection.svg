<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844"><title>Language Selection</title><rect width="390" height="844" fill="#F7FAFA"/><text x="28" y="68" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="700" fill="#008F87" text-anchor="start">NexVitals</text><text x="28" y="145" font-family="Inter,Arial,sans-serif" font-size="27" font-weight="700" fill="#172B3A" text-anchor="start">Choose your language</text><text x="28" y="178" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="400" fill="#64748B" text-anchor="start">Select your preferred language to continue.</text><rect x="28" y="230" width="334" height="72" rx="14" fill="#fff" stroke="#008F87" stroke-width="2"/><text x="52" y="261" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="600" fill="#172B3A" text-anchor="start">English</text><text x="52" y="283" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="400" fill="#64748B" text-anchor="start">Continue in English</text><circle cx="330" cy="266" r="9" fill="#fff" stroke="#008F87" stroke-width="2"/><circle cx="330" cy="266" r="5" fill="#008F87"/><rect x="28" y="324" width="334" height="72" rx="14" fill="#fff" stroke="#DCE7E7" stroke-width="1"/><text x="52" y="355" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="600" fill="#172B3A" text-anchor="start">हिंदी</text><text x="52" y="377" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="400" fill="#64748B" text-anchor="start">हिंदी में जारी रखें</text><circle cx="330" cy="360" r="9" fill="#fff" stroke="#008F87" stroke-width="2"/><rect x="28" y="418" width="334" height="72" rx="14" fill="#fff" stroke="#DCE7E7" stroke-width="1"/><text x="52" y="449" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="600" fill="#172B3A" text-anchor="start">मराठी</text><text x="52" y="471" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="400" fill="#64748B" text-anchor="start">मराठीत पुढे जा</text><circle cx="330" cy="454" r="9" fill="#fff" stroke="#008F87" stroke-width="2"/><rect x="28" y="660" width="334" height="54" rx="13" fill="#008F87" stroke="#008F87" stroke-width="0"/><text x="195" y="694" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="600" fill="#fff" text-anchor="middle">Continue</text><rect x="28" y="728" width="334" height="54" rx="13" fill="#fff" stroke="#008F87" stroke-width="1.5"/><text x="195" y="762" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="600" fill="#008F87" text-anchor="middle">Back</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844"><title>New Patient Registration</title><rect width="390" height="844" fill="#F7FAFA"/><text x="28" y="62" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="700" fill="#008F87" text-anchor="start">NexVitals</text><text x="28" y="116" font-family="Inter,Arial,sans-serif" font-size="25" font-weight="700" fill="#172B3A" text-anchor="start">Create your account</text><text x="28" y="145" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="400" fill="#64748B" text-anchor="start">Enter your details to get started.</text><text x="28" y="185" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="600" fill="#172B3A" text-anchor="start">Full Name</text><rect x="28" y="194" width="334" height="43" rx="9" fill="#fff" stroke="#DCE7E7"/><text x="44" y="221" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="400" fill="#94A3B8" text-anchor="start">Enter your full name</text><text x="28" y="268" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="600" fill="#172B3A" text-anchor="start">Mobile Number</text><rect x="28" y="277" width="334" height="43" rx="9" fill="#fff" stroke="#DCE7E7"/><text x="44" y="304" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="400" fill="#94A3B8" text-anchor="start">Enter mobile number</text><text x="28" y="351" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="600" fill="#172B3A" text-anchor="start">Email Address</text><rect x="28" y="360" width="334" height="43" rx="9" fill="#fff" stroke="#DCE7E7"/><text x="44" y="387" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="400" fill="#94A3B8" text-anchor="start">Enter email address</text><text x="28" y="434" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="600" fill="#172B3A" text-anchor="start">Date of Birth</text><rect x="28" y="443" width="334" height="43" rx="9" fill="#fff" stroke="#DCE7E7"/><t